name: Relyance Compliance Inspection
on:
  schedule:
    - cron: '0 0 * * *' # Run daily at 00:00 UTC
  workflow_dispatch: # Allow for manual trigger

jobs:
  relyance-compliance-inspector:
    permissions:
      contents: read
      id-token: write # Needed for Vault access

    runs-on: ubuntu-x64-small

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Get API key
        id: vault-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@5d7e361bc7e0a183cde8afe9899fb7b596d2659b # get-vault-secrets-v1.2.0
        with:
          repo_secrets: |
            API_KEY=relyance:API_KEY

      - name: Run Relyance scan
        env:
          API_KEY: "${{ fromJSON(steps.vault-secrets.outputs.secrets).API_KEY }}"
        # The image receives API_KEY, so it is pinned by digest: a moved tag must not change what runs.
        run: |
          docker pull gcr.io/relyance-ext/compliance_inspector:release_2026.1028.5@sha256:8ec3ca4904fd6cf7d2e617b7fa440a0929405515539de0aa3260876e34d8db93 && \
          docker run --rm -v ${{ github.workspace }}:/repo --env API_KEY gcr.io/relyance-ext/compliance_inspector:release_2026.1028.5@sha256:8ec3ca4904fd6cf7d2e617b7fa440a0929405515539de0aa3260876e34d8db93
