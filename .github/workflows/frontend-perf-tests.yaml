name: Frontend performance tests

on:
  schedule:
    - cron: "0 * * * *" # Run hourly
  workflow_dispatch: # Allow manual triggering

jobs:
  performance-tests:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-x64-large

    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Authenticate Docker
        uses: grafana/shared-workflows/actions/login-to-gar@afad5c7621e788905e6417f05b492972685ab1eb # login-to-gar/v1.0.4
        id: login-to-gar
        with:
          registry: 'us-docker.pkg.dev'

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install yarn dependencies
        uses: ./.github/actions/yarn-install

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright

      # Keep this after every `uses:` step so no action code runs once the
      # secrets have been fetched. get-vault-secrets v2 never exports to the
      # job environment; each value is passed only to the step that needs it.
      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1.0
        with:
          repo_secrets: |
            PROMETHEUS_URL=frontend_perf_tests:prometheus_push_url
            PROMETHEUS_USER=frontend_perf_tests:prometheus_user
            PROMETHEUS_TOKEN=frontend_perf_tests:prometheus_token
            FSPERF_USERNAME=frontend_perf_tests:fsperf_username
            FSPERF_PASSWORD=frontend_perf_tests:fsperf_password

      - name: Run Playwright tests (fsperf)
        id: pw-fsperf
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ./fsperf-pw-results.json
          METRICS_OUTPUT_PATH: ./fsperf-metrics.txt
          GRAFANA_URL: https://fsperf.grafana-dev.net
          GRAFANA_ADMIN_USER: ${{ fromJSON(steps.get-secrets.outputs.secrets).FSPERF_USERNAME }}
          GRAFANA_ADMIN_PASSWORD: ${{ fromJSON(steps.get-secrets.outputs.secrets).FSPERF_PASSWORD }}
        run: yarn e2e:playwright --grep @performance --reporter json

      - name: Bench report (fsperf)
        id: bench-fsperf
        if: always()
        continue-on-error: true
        env:
          PROMETHEUS_URL: ${{ fromJSON(steps.get-secrets.outputs.secrets).PROMETHEUS_URL }}
          PROMETHEUS_USER: ${{ fromJSON(steps.get-secrets.outputs.secrets).PROMETHEUS_USER }}
          PROMETHEUS_TOKEN: ${{ fromJSON(steps.get-secrets.outputs.secrets).PROMETHEUS_TOKEN }}
        run: |
          docker run \
            --rm \
            --volume="./fsperf-pw-results.json:/pw-results.json" \
            --volume="./fsperf-metrics.txt:/metrics.txt" \
            -e PROMETHEUS_URL="$PROMETHEUS_URL" \
            -e PROMETHEUS_USER="$PROMETHEUS_USER" \
            -e PROMETHEUS_PASSWORD="$PROMETHEUS_TOKEN" \
            us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench:v1.0.2 report \
              --service grafana \
              --service-url "https://fsperf.grafana-dev.net" \
              --service-version "rrc-instant" \
              --suite-name "FrontendPerfTests" \
              --report-input playwright \
              --report-output log \
              --prometheus-metrics \
              --run-metrics-file "/metrics.txt" \
              --run-stage rrc \
              --log-level DEBUG \
              /pw-results.json

      - name: Check status
        env:
          FSPERF_PW_OUTCOME: ${{ steps.pw-fsperf.outcome }}
          FSPERF_BENCH_OUTCOME: ${{ steps.bench-fsperf.outcome }}

        run: |
          echo "FSPERF_PW_OUTCOME: $FSPERF_PW_OUTCOME"
          echo "FSPERF_BENCH_OUTCOME: $FSPERF_BENCH_OUTCOME"

          if [[ "$FSPERF_PW_OUTCOME" != "success" || "$FSPERF_BENCH_OUTCOME" != "success" ]]; then
            echo "One or more test steps failed."
            exit 1
          fi
