name: Dispatch check for patch conflicts
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - "main"
      - "release-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # If a new commit is applied, just give up.
  cancel-in-progress: true

permissions: {}

# Since this is run on a pull request, we want to apply the patches intended for the
# target branch onto the source branch, to verify compatibility before merging.
jobs:
  dispatch-job:
    # Only runs in grafana/grafana; the workflow file is mirrored to other repos but the
    # patch-check pipeline (security-patch-actions + grafana-security-patches) is specific
    # to the OSS repo. Skipping here is acceptable to policy-bot, which allows `skipped`
    # as a pass.
    #
    # Also: dispatching a workflow requires brokering an installation token, which fails on
    # forks, so forks skip via the same check below and the dispatch-job-fork no-op records
    # the required status as success.
    if: ${{ github.repository == 'grafana/grafana' && ! github.event.pull_request.head.repo.fork }}
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      REPO: ${{ github.repository }}
      SENDER: ${{ github.event.sender.login }}
      SHA: ${{ github.sha }}
      PR_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-arm64-small
    permissions:
      id-token: write
      contents: read
      statuses: write
    steps:
      - name: Get GitHub App token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-releases-oss

      - name: "Dispatch job"
        id: dispatch
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.get-github-app-token.outputs.token }}
          script: |
            const {HEAD_REF, BASE_REF, REPO, SENDER, SHA, PR_COMMIT_SHA} = process.env;
            const runName = `${REPO} ${HEAD_REF}`;

            // Workflow run created_at values only have one-second resolution.
            const dispatchedAfter = new Date(Math.floor(Date.now() / 1000) * 1000).toISOString();

            const preexistingRunIds = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: 'grafana',
                repo: 'security-patch-actions',
                workflow_id: 'test-patches-event.yml',
                branch: 'main',
                created: `>=${dispatchedAfter}`,
                per_page: 100,
                page,
              });
              for (const run of data.workflow_runs) {
                if (run.name === runName) {
                  preexistingRunIds.push(run.id);
                }
              }
              if (data.workflow_runs.length < 100) {
                break;
              }
            }

            const { data } = await github.rest.actions.createWorkflowDispatch({
                owner: 'grafana',
                repo: 'security-patch-actions',
                workflow_id: 'test-patches-event.yml',
                ref: 'main',
                return_run_details: true,
                inputs: {
                  src_repo: REPO,
                  src_ref: HEAD_REF,
                  src_merge_sha: SHA,
                  src_pr_commit_sha: PR_COMMIT_SHA,
                  patch_repo: REPO + '-security-patches',
                  patch_ref: BASE_REF,
                  triggering_github_handle: SENDER
                }
            })

            core.setOutput('run_id', data && data.workflow_run_id ? String(data.workflow_run_id) : '');
            core.setOutput('dispatched_after', dispatchedAfter);
            core.setOutput('preexisting_run_ids', preexistingRunIds.join(','));

      - name: "Wait for success"
        # Only run metadata reads (status/conclusion) — never fetch logs or artifacts,
        # since the security-patch-actions workflow output must not be exposed.
        uses: actions/github-script@v8
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          DISPATCHED_AFTER: ${{ steps.dispatch.outputs.dispatched_after }}
          PREEXISTING_RUN_IDS: ${{ steps.dispatch.outputs.preexisting_run_ids }}
        with:
          github-token: ${{ steps.get-github-app-token.outputs.token }}
          script: |
            const {HEAD_REF, REPO, RUN_ID, DISPATCHED_AFTER, PREEXISTING_RUN_IDS} = process.env;
            const runName = `${REPO} ${HEAD_REF}`;
            const preexistingRunIds = new Set((PREEXISTING_RUN_IDS || '').split(',').filter(Boolean).map(Number));

            const maxWaitMs = 10 * 60 * 1000;
            const pollIntervalMs = 15 * 1000;
            // Without a run id from the dispatch response, give runs created around the
            // dispatch time to show up in the list before deciding which one is ours.
            const listSettleMs = 60 * 1000;
            const startTime = Date.now();

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            let runId = RUN_ID ? Number(RUN_ID) : null;
            let loggedRun = false;
            if (!runId && !DISPATCHED_AFTER) {
              core.setFailed('Dispatch step did not record when the patch check was dispatched');
              return;
            }
            if (!runId) {
              const settleUntil = Date.parse(DISPATCHED_AFTER) + listSettleMs;
              if (Date.now() < settleUntil) {
                await sleep(settleUntil - Date.now());
              }
            }

            while (true) {
              if (Date.now() - startTime >= maxWaitMs) {
                core.setFailed('Timed out after 10 minutes waiting for patch check to complete');
                return;
              }

              if (!runId) {
                // Branch and repository names cannot contain spaces, so only an exact name
                // match is a run of this branch.
                const candidates = [];
                for (let page = 1; ; page++) {
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner: 'grafana',
                    repo: 'security-patch-actions',
                    workflow_id: 'test-patches-event.yml',
                    branch: 'main',
                    created: `>=${DISPATCHED_AFTER}`,
                    per_page: 100,
                    page,
                  });
                  candidates.push(...data.workflow_runs.filter(run =>
                    run.name === runName &&
                    !preexistingRunIds.has(run.id) &&
                    Date.parse(run.created_at) >= Date.parse(DISPATCHED_AFTER)
                  ));
                  if (data.workflow_runs.length < 100) {
                    break;
                  }
                }

                if (candidates.length > 1) {
                  core.setFailed(`Found ${candidates.length} patch check runs named "${runName}" since this dispatch; cannot tell which one it created`);
                  return;
                }
                if (candidates.length === 0) {
                  await sleep(pollIntervalMs);
                  continue;
                }
                runId = candidates[0].id;
              }
              if (!loggedRun) {
                console.log(`Dispatched workflow run: https://github.com/grafana/security-patch-actions/actions/runs/${runId}`);
                loggedRun = true;
              }

              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: 'grafana',
                repo: 'security-patch-actions',
                run_id: runId,
              });

              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  return;
                }
                core.setFailed(`Patch check failed (conclusion: ${run.conclusion})`);
                return;
              }

              await sleep(pollIntervalMs);
            }

  dispatch-job-fork:
    # If the source is from a fork then use the built-in workflow token to create the same status and unconditionally
    # mark it as a success. Also only meaningful in grafana/grafana (the patch-check
    # pipeline is OSS-only); in mirrored copies this skips alongside dispatch-job.
    if: ${{ github.repository == 'grafana/grafana' && github.event.pull_request.head.repo.fork }}
    permissions:
      statuses: write
    runs-on: ubuntu-arm64-small
    steps:
      - name: All good
        run: |
          echo "It is not possible to check patches of a fork, unfortunately. We're working on it :-)"
