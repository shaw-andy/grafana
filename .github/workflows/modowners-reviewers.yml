name: Modowners reviewers

on:
  pull_request:
    paths:
      - go.mod
      - scripts/modowners/**
      - .github/workflows/modowners-reviewers.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  request:
    name: Request go.mod reviewers
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
      id-token: write
    steps:
      # Everything this job executes (modowners.go, the setup-go action, the root
      # go.mod) comes from the base commit. The pull request contributes only its
      # go.mod, as data. A same-repository branch can change scripts/modowners and
      # .github/actions, so none of it may run in the job that holds the app token.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: go.mod
          sparse-checkout-cone-mode: false
          path: _modowners_pr
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-build: 'false'
          go-version-file: scripts/modowners/go.mod
      - name: Find module owners
        id: modowners
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          # Do not follow a symlink from the pull request to other runner files.
          if [ -L _modowners_pr/go.mod ] || [ ! -f _modowners_pr/go.mod ]; then
            echo "::error::go.mod in the pull request is not a regular file"
            exit 1
          fi
          slugs=$(go run scripts/modowners/modowners.go reviewers go.mod _modowners_pr/go.mod)
          if [ -z "$slugs" ]; then
            echo "No module-owner reviewers to request"
            exit 0
          fi
          # The slugs come from the pull request's go.mod comments. Restrict them
          # to team-slug characters so they stay one line in GITHUB_OUTPUT.
          if grep -Evq '^[A-Za-z0-9_-]+$' <<< "$slugs"; then
            echo "::error::modowners returned a reviewer that is not a team slug"
            exit 1
          fi
          echo "slugs=$(tr '\n' ' ' <<< "$slugs")" >> "$GITHUB_OUTPUT"
      - name: Get GitHub App token
        id: get-github-app-token
        if: steps.modowners.outputs.slugs != ''
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-pr-automation
      - name: Request module owners
        if: steps.modowners.outputs.slugs != ''
        env:
          GH_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SLUGS: ${{ steps.modowners.outputs.slugs }}
        run: |
          set -euo pipefail
          echo "Requesting: $SLUGS"
          # One team per call so a 422 names the team. requested_teams is the
          # PR's full current set, so check the slug we asked for.
          failed=0
          for slug in $SLUGS; do
            err=$(mktemp)
            if ! assigned=$(jq -n --arg slug "$slug" '{reviewers: [], team_reviewers: [$slug]}' |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" --input - 2>"$err" |
              jq -r '.requested_teams[].slug'); then
              echo "::error::Request @grafana/${slug} failed: $(cat "$err")"
              failed=1
              rm -f "$err"
              continue
            fi
            rm -f "$err"
            echo "Assigned after @grafana/${slug}: $assigned"
            if ! grep -Fxq "$slug" <<< "$assigned"; then
              echo "::error::Did not assign @grafana/${slug}"
              failed=1
            fi
          done
          exit "$failed"
