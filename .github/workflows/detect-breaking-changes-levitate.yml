# Only runs if anything under the packages/ directory changes.
---
name: Levitate / Detect breaking changes in PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

on:
  pull_request:
    paths:
      - 'packages/**'
      - '.nvmrc'
      - '.github/workflows/detect-breaking-changes-levitate.yml'
    branches:
      - 'main'

jobs:
  buildPR:
    name: Build PR packages artifacts
    runs-on: ubuntu-arm64
    defaults:
      run:
        working-directory: './pr'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          path: './pr'
          persist-credentials: false

      - name: Setup Node
        uses: ./pr/.github/actions/setup-node
        with:
          cwd: './pr'

      - name: Install yarn dependencies
        uses: ./pr/.github/actions/yarn-install
        with:
          cwd: './pr'

      - name: Build packages
        run: yarn packages:build

      - name: Pack packages
        run: yarn packages:pack --out ./%s.tgz

      - name: Zip built tarballed packages
        run: zip -r ./pr_built_packages.zip ./packages/**/*.tgz

      - name: Upload build output as artifact
        uses: actions/upload-artifact@v5
        with:
          name: buildPr
          path: './pr/pr_built_packages.zip'

  buildBase:
    name: Build Base packages artifacts
    runs-on: ubuntu-arm64
    permissions:
      contents: read
    defaults:
      run:
        working-directory: './base'

    steps:
      # We need to check out the PR's branch to get actions from the same branch, so if they change in a PR this action can pick up those changes
      - uses: actions/checkout@v5
        with:
          path: './pr'
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          path: './base'
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: ./pr/.github/actions/setup-node # run the action from the PR, pointing to the base checkout
        with:
          cwd: './base'

      - name: Install yarn dependencies
        uses: ./pr/.github/actions/yarn-install # run the action from the PR, pointing to the base checkout
        with:
          cwd: './base'

      - name: Build packages
        run: yarn packages:build

      - name: Pack packages
        run: yarn packages:pack --out ./%s.tgz

      - name: Zip built tarballed packages
        run: zip -r ./base_built_packages.zip ./packages/**/*.tgz

      - name: Upload build output as artifact
        uses: actions/upload-artifact@v5
        with:
          name: buildBase
          path: './base/base_built_packages.zip'

  Detect:
    name: Detect breaking changes between PR and base
    runs-on: ubuntu-arm64
    needs: ['buildPR', 'buildBase']
    env:
      GITHUB_STEP_NUMBER: 8
    # This job runs code from the pull request, so it must never be able to request an OIDC token.
    permissions:
      contents: 'read'

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install yarn dependencies
        uses: ./.github/actions/yarn-install

      - name: Get built packages from pr
        uses: actions/download-artifact@v8
        with:
          name: buildPr

      - name: Get built packages from base
        uses: actions/download-artifact@v8
        with:
          name: buildBase

      - name: Unzip artifact from pr
        run: unzip -j pr_built_packages.zip -d ./pr && rm pr_built_packages.zip

      - name: Unzip artifact from base
        run: unzip -j base_built_packages.zip -d ./base && rm base_built_packages.zip

      - name: Detect breaking changes
        id: breaking-changes
        run: ./.github/workflows/scripts/levitate/check-breaking-changes.sh
        env:
          FORCE_COLOR: 3
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }} # used in check-breaking-changes.sh and levitate-parse-json-report.js

      - name: Persisting the check output
        run: |
            mkdir -p ./levitate
            jq -n \
              --arg exit_code "${IS_BREAKING}" \
              --arg message "${MESSAGE}" \
              --arg pr_number "${PR_NUMBER}" \
              '{exit_code: ($exit_code | tonumber), message: $message, pr_number: $pr_number}' > ./levitate/result.json
        env:
          IS_BREAKING: ${{ steps.breaking-changes.outputs.is_breaking }}
          MESSAGE: ${{ steps.breaking-changes.outputs.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload check output as artifact
        uses: actions/upload-artifact@v5
        with:
          name: levitate
          path: levitate/


  Report:
    name: Report breaking changes in PR comment
    runs-on: ubuntu-arm64
    needs: ['Detect']
    permissions:
      contents: read
      id-token: write
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Get GitHub App token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-pr-automation

      # This job can request an OIDC token, so it must only run files from the base branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # The artifact is written by pull request code: keep it out of the checkout and treat it as data only.
      - name: 'Download artifact'
        uses: actions/download-artifact@v8
        with:
          name: levitate
          path: ${{ runner.temp }}/levitate

      - name: Parsing levitate result
        uses: actions/github-script@v8
        id: levitate-run
        env:
          LEVITATE_RESULT: ${{ runner.temp }}/levitate/result.json
        with:
          script: |
            const filePath = process.env.LEVITATE_RESULT;
            const script = require('./.github/workflows/scripts/levitate/json-file-to-job-output.js');
            await script({ core, filePath });

      # Check if label exists
      - name: Check if "levitate breaking change" label exists
        id: does-label-exist
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            return labels.some(label => label.name === 'levitate breaking change') ? 1 : 0

      # put the markdown into a variable
      - name: Levitate Markdown
        id: levitate-markdown
        env:
          LEVITATE_MARKDOWN: ${{ runner.temp }}/levitate/levitate.md
        run: |
            if [ -f "${LEVITATE_MARKDOWN}" ]; then
            delimiter="LEVITATE_EOF_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            {
              echo "levitate_markdown<<${delimiter}"
              cat "${LEVITATE_MARKDOWN}"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
            else
              echo "levitate_markdown=No breaking changes detected" >> "$GITHUB_OUTPUT"
            fi


      # Comment on the PR
      - name: Comment on PR
        if: steps.levitate-run.outputs.exit_code == 1
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: levitate-breaking-change-comment
          number: ${{ github.event.pull_request.number }}
          message: |
            ⚠️ &nbsp;&nbsp;**Possible breaking changes (md version)**&nbsp;&nbsp; ⚠️

            ${{ steps.levitate-markdown.outputs.levitate_markdown }}

            [Read our guideline](https://github.com/grafana/grafana/blob/main/contribute/breaking-changes-guide/breaking-changes-guide.md)

            * Your pull request merge won't be blocked.
          GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}

      # Remove comment from the PR (no more breaking changes)
      - name: Remove comment from PR
        if: steps.levitate-run.outputs.exit_code == 0
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: levitate-breaking-change-comment
          number: ${{ github.event.pull_request.number }}
          delete: true
          GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}

      - name: Send Slack Message via Payload
        id: slack
        if: steps.levitate-run.outputs.exit_code == 1 && steps.does-label-exist.outputs.result == 0 && github.repository == 'grafana/grafana'
        uses: grafana/shared-workflows/actions/send-slack-message@551bc8d50017d3e95d5da3f8a4826e733a208dc0 # v3.0.2
        with:
          method: chat.postMessage
          payload-templated: true
          payload:  |
            {
              "channel": "C08QATP6AE9",
              "text": ":warning: Possible breaking changes detected in *PR:* <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} :warning:",
              "icon_emoji": ":grot:",
              "username": "Levitate Bot",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*grafana/grafana* repository has possible breaking changes"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*PR:* <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\n\nAuthor: ${{ github.event.pull_request.user.login }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job>"
                    }
                  ]
                }
              ]
            }

      # Add the label
      - name: Add "levitate breaking change" label
        if: steps.levitate-run.outputs.exit_code == 1 && steps.does-label-exist.outputs.result == 0
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ steps.get-github-app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              issue_number: process.env.PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['levitate breaking change']
            })

      # Remove label (no more breaking changes)
      - name: Remove "levitate breaking change" label
        if: steps.levitate-run.outputs.exit_code == 0 && steps.does-label-exist.outputs.result == 1
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ steps.get-github-app-token.outputs.token }}
          script: |
            await github.rest.issues.removeLabel({
              issue_number: process.env.PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'levitate breaking change'
            })

      # Add reviewers
      # This is very weird, the actual request goes through (comes back with a 201), but does not assign the team.
      # Related issue: https://github.com/renovatebot/renovate/issues/1908
      - name: Add "grafana/grafana-frontend-platform" as a reviewer
        if: steps.levitate-run.outputs.exit_code == 1
        uses: actions/github-script@v8
        # FIXME: GATB doesn't seem to grant us necessary pull_requests write permissions
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ steps.get-github-app-token.outputs.token }}
          script: |
            await github.rest.pulls.requestReviewers({
              pull_number: process.env.PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
              reviewers: [],
              team_reviewers: ['grafana-frontend-platform']
            });

      # Remove reviewers (no more breaking changes)
      - name: Remove "grafana/grafana-frontend-platform" from the list of reviewers
        if: steps.levitate-run.outputs.exit_code == 0
        uses: actions/github-script@v8
        # FIXME: GATB doesn't seem to grant us necessary pull_requests write permissions
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ steps.get-github-app-token.outputs.token }}
          script: |
            await github.rest.pulls.removeRequestedReviewers({
              pull_number: process.env.PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
              reviewers: [],
              team_reviewers: ['grafana-frontend-platform']
            });

      - name: Exit
        run: |
          if [ "${LV_EXIT_CODE}" -ne 0 ]; then
            echo "Breaking changes detected. Please check the levitate report in your pull request. This workflow won't block merging."
          fi

          exit "${LV_EXIT_CODE}"
        shell: bash
        env:
          LV_EXIT_CODE: ${{ steps.levitate-run.outputs.exit_code }}
