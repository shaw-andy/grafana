name: Deploy Storybook preview

on:
  pull_request:
    paths:
      - 'packages/grafana-ui/**'
      - 'packages/grafana-data/src/themes/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-storybook-preview:
    name: Build Storybook preview
    runs-on: ubuntu-x64
    # Don't run from forks for the moment. If we find this useful we can do the workflow_run dance
    # to make it work for forks.
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install yarn dependencies
        uses: ./.github/actions/yarn-install

      - name: Build storybook
        run: yarn storybook:build

      - name: Upload build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: storybook-preview-build
          path: packages/grafana-ui/dist/storybook
          if-no-files-found: error
          retention-days: 1

  deploy-storybook-preview:
    name: Deploy Storybook preview
    # Uploads from a separate job so the OIDC-enabled step never runs
    # alongside code from the PR. This job must not check out or execute
    # anything from the PR; the build artifact is only uploaded as data.
    needs: build-storybook-preview
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
      id-token: write # required for push-to-gcs

    env:
      BUCKET_NAME: grafana-storybook-previews

    environment:
      name: "storybook-pr-preview-${{ github.event.pull_request.number }}"
      url: ${{ steps.storybook-url.outputs.url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-preview-build
          path: storybook

      # Create the GCS folder name for the preview. Creates a consistent name for all deploys for the PR.
      # Matches format of `pr_<PR_NUMBER>_<SANITIZED_BRANCH>`.
      # Where `SANITIZED_BRANCH` is the branch name with only alphanumeric and hyphens, limited to 30 characters.
      - name: Create deploy name
        id: create-deploy-name
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Convert branch name to only contain alphanumeric and hyphens
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr -cs "[:alnum:]-" "-" | sed "s/^-//;s/-$//")

          # Check if SANITIZED_BRANCH is empty and fail if it is
          if [ -z "$SANITIZED_BRANCH" ]; then
            echo "Error: Branch name resulted in empty string after sanitization"
            exit 1
          fi

          echo "deploy-name=pr_${PR_NUMBER}_${SANITIZED_BRANCH:0:30}" >> "$GITHUB_OUTPUT"

      - name: Upload Storybook
        uses: grafana/shared-workflows/actions/push-to-gcs@088e23a5f09be7b85cedbf89f119244125878ad9 # push-to-gcs/v0.3.2
        with:
          environment: prod
          bucket: ${{ env.BUCKET_NAME }}
          bucket_path: ${{ steps.create-deploy-name.outputs.deploy-name }}
          path: storybook
          service_account: github-gf-storybook-preview@grafanalabs-workload-identity.iam.gserviceaccount.com
          parent: false

      - name: Set storybook URL
        id: storybook-url
        env:
          DEPLOY_NAME: ${{ steps.create-deploy-name.outputs.deploy-name }}
        run: |
          echo "url=https://storage.googleapis.com/${BUCKET_NAME}/${DEPLOY_NAME}/index.html" >> "$GITHUB_OUTPUT"

      - name: Write summary
        env:
          STORYBOOK_URL: ${{ steps.storybook-url.outputs.url }}
        run: |
          echo "## Storybook preview deployed! 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "Check it out at ${STORYBOOK_URL}" >> "$GITHUB_STEP_SUMMARY"
