name: Documentation CI
on:
  pull_request:
    branches: ["main"]
    paths: ["docs/sources/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  vale:
    runs-on: ubuntu-x64-small
    permissions:
      contents: read
      pull-requests: write
    container:
      image: grafana/vale@sha256:bb6896be023b1bddc3c73674701e77d318a04ae6ec6b01325cd535c8ab2f8a67 # latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: grafana/writers-toolkit/vale-action@67d43d461804a3413c2e11fd7899ff01e05b2563 # vale-action/v2.1.0
        with:
          fail_on_error: "false"
          filter: '.Name in ["Grafana.GrafanaCom", "Grafana.WordList", "Grafana.Spelling", "Grafana.ProductPossessives"]'
          token: ${{ secrets.GITHUB_TOKEN }}
