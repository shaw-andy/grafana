name: Crowdin Upload Action

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/locales/en-US/grafana.json'
      - 'public/app/plugins/datasource/azuremonitor/locales/en-US/grafana-azure-monitor-datasource.json'
      - 'packages/grafana-sql/src/locales/en-US/grafana-sql.json'
      - 'apps/advisor/pkg/translations/en-US/grafana-advisor.json'
    branches:
      - main

jobs:
  upload-sources-to-crowdin:
    if: github.repository == 'grafana/grafana'
    runs-on: ubuntu-x64
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: 'Get vault secrets'
        id: vault-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@6a943082408bb241a26b14661e446220c3e62b16 # main
        with:
            # Vault secret paths:
            # - ci/repo/grafana/grafana/grafana-frontend-crowdin-token
            repo_secrets: |
                CROWDIN_TOKEN=grafana-frontend-crowdin-token:access_token
      - name: Upload to Crowdin
        uses: grafana/grafana-github-actions/crowdin-upload@af3213823a725b60b60947211de51d0fa3959391 # main
        with:
          crowdin_token: ${{ fromJSON(steps.vault-secrets.outputs.secrets).CROWDIN_TOKEN }}
          crowdin_project_id: 5

