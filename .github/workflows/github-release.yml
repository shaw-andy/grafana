name: Create or update GitHub release
on:
  workflow_call:
    inputs:
      version:
        required: true
        description: Needs to match, exactly, the name of a milestone (NO v prefix)
        type: string
      latest:
        required: false
        default: "0"
        description: Mark this release as latest (`1`) or not (`0`, default)
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Needs to match, exactly, the name of a milestone (NO v prefix)
        type: string
      latest:
        required: false
        default: "0"
        description: Mark this release as latest (`1`) or not (`0`, default)
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  main:
    permissions:
      # contents: write allows the action(s) to create github releases
      contents: write
    runs-on: ubuntu-arm64-small
    steps:
      - name: Create GitHub release (manually invoked)
        uses: grafana/grafana-github-actions-go/github-release@015e217f58ce35182230e20ac721e8351258f0ad # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          latest: ${{ inputs.latest }}
          dry_run: ${{ inputs.dry_run }}
  deploy-storybook:
    needs: main
    if: ${{ !inputs.dry_run && inputs.latest == '1' }}
    permissions:
      contents: read
      id-token: write
    uses: grafana/grafana/.github/workflows/deploy-storybook.yml@7fac6fc9b283384347b8643045793481dc3ee6c4
    with:
      version: ${{ inputs.version }}
