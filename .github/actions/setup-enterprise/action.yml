name: 'Setup Grafana Enterprise'
description: >-
  Checks out the matching branch of an existing ../grafana-enterprise clone and overlays it onto this repository.
  Callers must clone grafana-enterprise in an inline workflow step first; this action runs from the
  pull request checkout, so it must never receive a token.

runs:
  using: "composite"
  steps:
    - name: Setup Enterprise
      shell: bash
      run: |
        RETRIES="5"
        grafana_root="$PWD"

        if [ ! -d ../grafana-enterprise/.git ]; then
          echo "../grafana-enterprise is missing; clone it before running this action."
          exit 1
        fi

        cd ../grafana-enterprise

        for i in $(seq 1 $RETRIES); do
          echo "Attempt $i to checkout..."

          if git checkout ${GITHUB_HEAD_REF}; then
            echo "checked out ${GITHUB_HEAD_REF}"
          elif git checkout ${GITHUB_BASE_REF}; then
            echo "checked out ${GITHUB_BASE_REF}"
          else
            git checkout main
          fi

          if [ $? -eq 0 ]; then
            echo "Checkout succeeded, breaking retry loop"
            break
          fi

          if [ $i -eq $RETRIES ]; then
            echo "Checkout failed after $RETRIES attempts, failing pipeline."
            exit 1
          fi

          sleep "$i"
        done

        QUIET=1 ./build.sh "$grafana_root"
